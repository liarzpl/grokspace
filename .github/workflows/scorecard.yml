name: Scorecard

# OpenSSF Scorecard: an outside-in read of this repo's supply-chain practices
# (pinned actions, token permissions, branch protection, SAST, ...). Results go
# to the Security tab as SARIF and, because `publish_results` is on, to
# api.scorecard.dev, which is what the README badge reads.
#
# The publish API rejects results unless the workflow keeps to its rules
# (scorecard-action README, "Workflow Restrictions"): no top-level `env` or
# `defaults`, no workflow-level write permissions, `id-token: write` only on
# this job, and only steps from the approved action list. Keep it that way.
on:
  push:
    branches: [main]
  schedule:
    # Weekly, Tuesday 06:37 UTC, a day after CodeQL's cron.
    - cron: "37 6 * * 2"
  # Branch-protection changes are one of the things Scorecard grades, so a
  # change to them re-scores straight away.
  branch_protection_rule:

permissions:
  contents: read

# Third-party actions are pinned to a full commit SHA. A moving tag
# (`@v2`) can be retagged; a SHA cannot. The comment after the SHA is
# the human-readable version, not the pin.

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Upload the SARIF to the Security tab.
      security-events: write
      # OIDC token that authenticates the publish to api.scorecard.dev.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # Five-day copy anyone can download from the run page; without it the
      # results are visible only to people with write access, on the Security tab.
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
