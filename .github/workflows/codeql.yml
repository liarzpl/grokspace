name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday 06:17 UTC. Off the hour so it does not queue behind
    # everyone else's on-the-hour crons.
    - cron: "17 6 * * 1"

# A newer push to the same branch makes the run already going for it pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege at the workflow level; the one job that uploads results
# raises `security-events: write` for itself below.
permissions:
  contents: read

# Third-party actions are pinned to a full commit SHA. A moving tag
# (`@v4`) can be retagged; a SHA cannot. The comment after the SHA is
# the human-readable version, not the pin.

jobs:
  # One job per language, so a red check names which analysis failed and a
  # slow one does not hold the other back. Rust is deliberately absent: CodeQL
  # would have to build the Tauri crate (WebKitGTK and all), which the CI
  # budget does not cover; clippy, `cargo audit`, and the tests gate it instead.
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Upload the analysis to the Security tab.
      security-events: write
      # Read the workflow run itself, which the upload step uses for context.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Vite renderer, scripts/, and the tests. Interpreted, so no build.
          - language: javascript-typescript
            build-mode: none
          # The workflows under .github/ themselves: untrusted-input injection,
          # unpinned actions, excessive permissions.
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:${{ matrix.language }}"
