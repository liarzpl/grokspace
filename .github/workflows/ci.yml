name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by release.yml, so a tagged build runs exactly the checks a pull request
  # does rather than a second copy of them that can drift.
  workflow_call:

# A newer push to the same branch makes the run already going for it pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. These jobs only read the tree. The release workflow
# raises `contents: write` on the one job that drafts the GitHub release.
permissions:
  contents: read

# Third-party actions are pinned to a full commit SHA. A moving tag
# (`@v7`) can be retagged; a SHA cannot. The comment after the SHA is
# the human-readable version, not the pin.

jobs:
  # Split from the backend so the two run at once, and so a red check names which
  # half of the app broke without anyone opening the log.
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Vite 8 engines: ^20.19.0 || >=22.12.0. Pin the 22 floor, not `22`
          # (that major also matches 22.0–22.11, which Vite rejects).
          node-version: "22.12"
          cache: npm

      - run: npm ci

      # Production tree only. Dev-only advisories (Vitest mocker) are lock-fixed
      # separately; this keeps a shipped-DMG regression from landing silent.
      - name: Audit production dependencies
        run: npm audit --omit=dev

      # `npm run build` is `tsc --noEmit && vite build`. tsconfig include covers
      # src/, vite.config.ts, and scripts/, so this is the type check as well as
      # the bundle.
      - name: Type-check and build
        run: npm run build

      # WP-O10. The counts and the coverage text-summary go to the job summary as
      # well as the log, so the run page says how many tests ran and what they
      # cover without anyone opening the log. The exit status returned is
      # vitest's, not tee's (pipefail), and the summary is written before it is
      # returned, so a red run still shows its numbers.
      - name: Test and coverage HTML
        run: |
          set -o pipefail
          status=0
          npm run test:coverage 2>&1 | tee "$RUNNER_TEMP/vitest.log" || status=$?
          {
            echo '### Vitest'
            echo '```'
            grep -E '^ *(Test Files|Tests) ' "$RUNNER_TEMP/vitest.log" \
              || echo 'No test counts in the output: did Vitest start?'
            echo
            sed -n '/Coverage summary/,/^==*$/p' "$RUNNER_TEMP/vitest.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload coverage HTML
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-coverage-html
          path: coverage
          if-no-files-found: error

  # The release workflow cannot be run to see whether it works: it needs a macOS
  # runner and Apple credentials, and a tag it would then publish. Static checking is
  # the only automated safety net it has, so it gets one. actionlint also runs
  # shellcheck over every `run:` block, which is where the release job does its real
  # work.
  workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint the workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tauri will not compile without WebKitGTK, so even `cargo test` needs these.
      # GrokSpace targets macOS; Linux is here because it is what CI runs on, which
      # is the reason the app is kept building on it at all.
      - name: Install Tauri's system dependencies
        working-directory: .
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf

      # No toolchain action: rust-toolchain.toml already pins the channel and asks
      # for clippy and rustfmt, and rustup reads it on the first cargo call. Naming
      # the toolchain here too would be a second place to keep in step.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ./src-tauri -> target

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # WP-O10. Each test binary's `test result:` line and their sum go to the
      # job summary, for the same reason as the Vitest block in `frontend`, and
      # with the same care over the exit status.
      - name: Test
        run: |
          set -o pipefail
          status=0
          cargo test 2>&1 | tee "$RUNNER_TEMP/cargo-test.log" || status=$?
          {
            echo '### cargo test'
            echo '```'
            # One header and one result line per test binary; the hashed
            # target path after the header says nothing a reader wants.
            grep -E '^ *(Running|Doc-tests) |^test result:' "$RUNNER_TEMP/cargo-test.log" \
              | sed -E 's# \(target/.*\)$##' \
              || echo 'No test results in the output: did the tests compile?'
            echo '```'
            # `test result: ok. 345 passed; 0 failed; 0 ignored; ...`: the
            # counts are fields 4, 6 and 8.
            awk '/^test result:/ { passed += $4; failed += $6; ignored += $8; binaries++ }
                 END { printf "**%d passed, %d failed, %d ignored** in %d test binaries\n",
                              passed, failed, ignored, binaries }' \
              "$RUNNER_TEMP/cargo-test.log"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # The Rust counterpart of `npm audit` above: Cargo.lock against the RustSec
  # advisory database. Its own job rather than a step in `backend` because it
  # needs neither the system libraries nor a build of the tree, and a red check
  # should name the advisory, not the test suite. What fails and the one
  # documented ignore live in src-tauri/.cargo/audit.toml, which cargo-audit
  # reads from the directory it runs in — so `cargo audit` by hand in src-tauri
  # gives the same verdict.
  audit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same cache as `backend`, wanted here for ~/.cargo/bin: it keeps the
      # cargo-audit binary between runs, so only the first run compiles it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ./src-tauri -> target

      # From crates.io with `cargo install`, not an install action: nothing new
      # to pin or to trust. The version is pinned the way the actions above are
      # and `--locked` builds it from its own lockfile. When the cache already
      # holds this version, cargo says so and does nothing.
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Cargo.lock
        run: cargo audit

  # TEST-002. Host smoke (fixture folder, shell pane, graph:demo → Graph
  # snapshot). A WebView/Playwright drive is skipped: this runner has WebKitGTK
  # so Tauri links, not a usable window. `npm run test:e2e` is the same check.
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12"
          cache: npm

      - run: npm ci

      - name: Install Tauri's system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ./src-tauri -> target

      - name: TEST-002 smoke
        run: npm run test:e2e
