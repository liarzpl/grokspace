[package]
name = "grokspace"
version = "0.1.0"
description = "Local-first macOS multi-agent coding workspace powered by Grok Build"
authors = ["GrokSpace"]
license = "MIT"
edition = "2021"
rust-version = "1.88"
readme = "../README.md"
homepage = "https://github.com/liarzpl/grokspace#readme"
repository = "https://github.com/liarzpl/grokspace"
# crates.io limits: at most five keywords and five categories; category
# names must be slugs from https://crates.io/category_slugs.
keywords = ["tauri", "grok", "acp", "ai-agents", "local-first"]
categories = ["development-tools", "gui"]

[lib]
name = "grokspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
portable-pty = "0.9"
notify = "8"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
dirs = "6"

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }
