<!doctype html>
<!--
  Source artwork for the app icon. Rendered to a 1024x1024 PNG with headless
  Chrome, then expanded into every platform size by `npm run tauri icon`.
  See src-tauri/icons/source/README.md.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1024px;
        height: 1024px;
        background: transparent;
      }

      /* macOS icons sit on a ~824px squircle inside the 1024px canvas. */
      .icon {
        position: absolute;
        inset: 100px;
        border-radius: 185px;
        background: linear-gradient(160deg, #2b3350 0%, #141824 55%, #0c0e15 100%);
        box-shadow:
          inset 0 3px 0 rgba(255, 255, 255, 0.12),
          inset 0 -3px 0 rgba(0, 0, 0, 0.5);
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 34px;
        padding: 132px;
        box-sizing: border-box;
      }

      /* Four panes, mirroring the terminal grid the app is built around. */
      .pane {
        border-radius: 30px;
        background: rgba(232, 235, 242, 0.09);
        border: 4px solid rgba(232, 235, 242, 0.14);
      }

      .pane.active {
        background: linear-gradient(150deg, #7f9bff 0%, #5b7bfa 100%);
        border-color: rgba(255, 255, 255, 0.55);
        position: relative;
        box-shadow: 0 0 60px rgba(109, 140, 255, 0.55);
      }

      /* A shell prompt caret marks the pane that currently has an agent in it. */
      .pane.active::before {
        content: "";
        position: absolute;
        left: 34%;
        top: 50%;
        width: 46px;
        height: 46px;
        border-right: 14px solid #0b0d12;
        border-bottom: 14px solid #0b0d12;
        transform: translate(-50%, -50%) rotate(-45deg);
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="icon">
      <div class="pane active"></div>
      <div class="pane"></div>
      <div class="pane"></div>
      <div class="pane"></div>
    </div>
  </body>
</html>
